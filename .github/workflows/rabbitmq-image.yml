name: Build RabbitMQ image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reusable-build-debian-image.yml
      - .github/workflows/reusable-prepare-image-matrix.yml
      - .github/workflows/reusable-publish-image-manifest.yml
      - .github/workflows/rabbitmq-image.yml
      - images/rabbitmq/**
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      push:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      push:
        description: Push to the configured registry after build, smoke test, SBOM, and scan.
        required: false
        default: false
        type: boolean

concurrency:
  group: rabbitmq-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: rabbitmq

  rabbitmq:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: rabbitmq
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,rabbitmq-server
      cmd: '["/usr/sbin/rabbitmq-server","--version"]'
      workdir: /var/lib/rabbitmq
      exposed_ports: "5672 15672"
      runtime_user_name: rabbitmq
      runtime_home: /var/lib/rabbitmq
      environment: |
        HOME=/var/lib/rabbitmq
        RABBITMQ_MNESIA_BASE=/var/lib/rabbitmq/mnesia
      writable_paths: /var/lib/rabbitmq /run/rabbitmq /var/log/rabbitmq
      smoke_mode: oneshot
      smoke_command: /usr/sbin/rabbitmq-server --version
      push_primary_tag: false
      push: ${{ !inputs.orchestrated && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.push)) }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true
      sign: true
    secrets: inherit

  contract-aggregate:
    needs: [prepare, rabbitmq]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: rabbitmq
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs.rabbitmq.result }}

  rabbitmq-manifest:
    needs: [prepare, contract-aggregate]
    if: ${{ !inputs.orchestrated && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.push)) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.manifest_matrix) }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-publish-image-manifest.yml
    with:
      image_name: rabbitmq
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arches: ${{ matrix.debian_arches }}
      sign: true
    secrets: inherit
