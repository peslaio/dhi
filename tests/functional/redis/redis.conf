bind 0.0.0.0
port 6379
protected-mode no
daemonize no
supervised no

dir /data
pidfile /run/redis/redis-server.pid
logfile ""

appendonly yes
appendfsync everysec
save ""

# Redis replays AOF commands as the default user. Keep that internal replay
# identity enabled with a test-only password that is never provided to the
# verifier; unauthenticated clients still receive NOAUTH.
user default on >dhi-aof-replay-only-password ~* +@all
# This credential is deliberately fixed and is valid only inside this isolated
# functional-test network. It is not a production secret.
user functional on >dhi-functional-only-password ~dhi:* +ping +get +set +del +incr +expire +ttl +multi +exec +discard
