name: Build MariaDB image

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: mariadb-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: mariadb

  mariadb:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: mariadb
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,mariadb-server
      cmd: '["/usr/sbin/mariadbd","--version"]'
      workdir: /var/lib/mysql
      exposed_ports: "3306"
      runtime_user_name: mysql
      runtime_home: /var/lib/mysql
      writable_paths: /var/lib/mysql /run/mysqld /var/log/mysql
      smoke_mode: oneshot
      smoke_command: /usr/sbin/mariadbd --version
      smoke_expected_output: mariadbd
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, mariadb]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: mariadb
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs.mariadb.result }}
