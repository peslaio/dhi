services:
  backend:
    build:
      context: ../harness
      args:
        PYTHON_IMAGE: ${DHI_FIXTURE_PYTHON_IMAGE:?set DHI_FIXTURE_PYTHON_IMAGE}
    pull_policy: never
    labels:
      io.pesla.dhi.functional.role: fixture
    command: [serve, --port, "8080", --body, dhi-nginx-backend-ok, --identity, nginx-backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  app:
    image: ${DHI_DERIVED_IMAGE:?set DHI_DERIVED_IMAGE}
    build:
      context: .
      args:
        RUNTIME_IMAGE: ${DHI_IMAGE_UNDER_TEST:?set DHI_IMAGE_UNDER_TEST}
        DHI_SOURCE_IMAGE_ID: ${DHI_SOURCE_IMAGE_ID:?set DHI_SOURCE_IMAGE_ID}
    pull_policy: never
    platform: ${DHI_PLATFORM:?set DHI_PLATFORM}
    labels:
      io.pesla.dhi.functional.role: sut
      io.pesla.dhi.functional.identity-mode: derived-rootfs-prefix
    read_only: true
    tmpfs:
      - /run/nginx:uid=10001,gid=0,mode=0770
      - /var/cache/nginx:uid=10001,gid=0,mode=0770
      - /var/lib/nginx:uid=10001,gid=0,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [backend]

  test:
    build:
      context: ../harness
      args:
        PYTHON_IMAGE: ${DHI_FIXTURE_PYTHON_IMAGE:?set DHI_FIXTURE_PYTHON_IMAGE}
    pull_policy: never
    labels:
      io.pesla.dhi.functional.role: test
    command:
      - web
      - --base-url
      - http://app:8080
      - --marker
      - dhi-nginx-app-ok
      - --proxy-path
      - /proxy/echo
      - --proxy-identity
      - nginx-backend
      - --concurrency
      - "8"
      - --timeout
      - "90"
    depends_on: [app, backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  default:
    internal: true
