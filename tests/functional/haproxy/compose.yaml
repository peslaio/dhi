services:
  backend:
    build:
      context: ../harness
      args:
        PYTHON_IMAGE: ${DHI_FIXTURE_PYTHON_IMAGE:?set DHI_FIXTURE_PYTHON_IMAGE}
    pull_policy: never
    labels:
      io.pesla.dhi.functional.role: fixture
    command: [serve, --port, "8080", --body, dhi-haproxy-proxy-ok]
    healthcheck:
      test: [CMD, python, /harness/probe.py, http, --url, http://127.0.0.1:8080/, --contains, dhi-haproxy-proxy-ok, --timeout, "5"]
      start_period: 10s
      interval: 2s
      timeout: 6s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  app:
    image: ${DHI_DERIVED_IMAGE:?set DHI_DERIVED_IMAGE}
    build:
      context: .
      args:
        RUNTIME_IMAGE: ${DHI_IMAGE_UNDER_TEST:?set DHI_IMAGE_UNDER_TEST}
        DHI_SOURCE_IMAGE_ID: ${DHI_SOURCE_IMAGE_ID:?set DHI_SOURCE_IMAGE_ID}
    pull_policy: never
    platform: ${DHI_PLATFORM:?set DHI_PLATFORM}
    labels:
      io.pesla.dhi.functional.role: sut
      io.pesla.dhi.functional.identity-mode: derived-rootfs-prefix
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /run/haproxy:uid=10001,gid=0,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  test:
    build:
      context: ../harness
      args:
        PYTHON_IMAGE: ${DHI_FIXTURE_PYTHON_IMAGE:?set DHI_FIXTURE_PYTHON_IMAGE}
    pull_policy: never
    labels:
      io.pesla.dhi.functional.role: test
    command: [http, --url, http://app:8080/, --contains, dhi-haproxy-proxy-ok]
    depends_on: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  default:
    internal: true
