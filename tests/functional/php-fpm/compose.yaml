services:
  app:
    image: ${DHI_DERIVED_IMAGE:?set DHI_DERIVED_IMAGE}
    build:
      context: .
      args:
        RUNTIME_IMAGE: ${DHI_IMAGE_UNDER_TEST:?set DHI_IMAGE_UNDER_TEST}
        DHI_SOURCE_IMAGE_ID: ${DHI_SOURCE_IMAGE_ID:?set DHI_SOURCE_IMAGE_ID}
    pull_policy: never
    platform: ${DHI_PLATFORM:?set DHI_PLATFORM}
    labels:
      io.pesla.dhi.functional.role: sut
      io.pesla.dhi.functional.identity-mode: derived-rootfs-prefix
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=0,mode=1777
      - /run/php-fpm:uid=10001,gid=0,mode=0770
      - /var/log/php8.2-fpm:uid=10001,gid=0,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        NGINX_FIXTURE_IMAGE: ${DHI_FIXTURE_NGINX_IMAGE:?set DHI_FIXTURE_NGINX_IMAGE}
    pull_policy: never
    labels:
      io.pesla.dhi.functional.role: fixture
    depends_on: [app]
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  test:
    build:
      context: ../harness
      args:
        PYTHON_IMAGE: ${DHI_FIXTURE_PYTHON_IMAGE:?set DHI_FIXTURE_PYTHON_IMAGE}
    pull_policy: never
    labels:
      io.pesla.dhi.functional.role: test
    command:
      - php
      - --base-url
      - http://web:8080
      - --extensions
      - calendar,ctype,exif,FFI,fileinfo,ftp,gettext,iconv,PDO,Phar,posix,readline,shmop,sockets,sysvmsg,sysvsem,sysvshm,tokenizer,Zend OPcache
      - --concurrency
      - "8"
      - --timeout
      - "90"
    depends_on: [web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  default:
    internal: true
