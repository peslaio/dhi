name: Build Java JRE image

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: java-jre-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: java-jre

  java-jre:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: java-jre
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,openjdk-17-jre-headless
      cmd: '["/usr/bin/java","-version"]'
      workdir: /app
      environment: |
        JAVA_HOME=${{ matrix.debian_arch == 'arm64' && '/usr/lib/jvm/java-17-openjdk-arm64' || '/usr/lib/jvm/java-17-openjdk-amd64' }}
      runtime_user_name: java
      runtime_home: /home/java
      writable_paths: /app /home/java
      smoke_mode: oneshot
      smoke_command: /usr/bin/java -version
      smoke_expected_output: 'version "17'
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, java-jre]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: java-jre
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs['java-jre'].result }}
