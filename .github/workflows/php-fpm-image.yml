name: Build PHP-FPM image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reusable-build-debian-image.yml
      - .github/workflows/reusable-prepare-image-matrix.yml
      - .github/workflows/reusable-publish-image-manifest.yml
      - .github/workflows/php-fpm-image.yml
      - images/php-fpm/**
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      push:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      push:
        description: Push to the configured registry after build, smoke test, SBOM, and scan.
        required: false
        default: false
        type: boolean

concurrency:
  group: php-fpm-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: php-fpm

  php-fpm:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: php-fpm
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,php8.2-fpm
      runtime_closure: true
      runtime_closure_binaries: |
        /usr/sbin/php-fpm8.2
        /usr/lib/php/*/*.so
      runtime_closure_paths: |
        /etc/php
        /etc/php-fpm
        /etc/ssl/certs
        /usr/lib/php
        /usr/share/php8.2-common
        /usr/share/php8.2-fpm
        /usr/share/zoneinfo
      forbidden_packages: apt,libapt-pkg6.0,debian-archive-keyring,gpgv,bash,dash,dpkg
      allowed_packages: ca-certificates,libbsd0,libc6,libcap2,libedit2,libffi8,libgcc-s1,libgpg-error0,liblzma5,libmd0,libssl3,libtinfo6,php8.2-common,php8.2-fpm,tzdata,zlib1g
      config_path: images/php-fpm/php-fpm.conf
      entrypoint: '["/usr/sbin/php-fpm8.2"]'
      cmd: '["-F","-O","-y","/etc/php-fpm/php-fpm.conf"]'
      workdir: /var/www/html
      exposed_ports: "9000"
      runtime_user_name: php
      runtime_home: /var/www/html
      writable_paths: /run/php-fpm /var/log/php8.2-fpm /var/www/html
      smoke_mode: running
      smoke_tcp_port: "9000"
      smoke_command: /usr/sbin/php-fpm8.2 -tt -y /etc/php-fpm/php-fpm.conf
      smoke_expected_output: "test is successful"
      remove_shell: true
      push_primary_tag: false
      push: ${{ !inputs.orchestrated && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.push)) }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true
      sign: true
    secrets: inherit

  contract-aggregate:
    needs: [prepare, php-fpm]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: php-fpm
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs['php-fpm'].result }}

  php-fpm-manifest:
    needs: [prepare, contract-aggregate]
    if: ${{ !inputs.orchestrated && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.push)) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.manifest_matrix) }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-publish-image-manifest.yml
    with:
      image_name: php-fpm
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arches: ${{ matrix.debian_arches }}
      sign: true
    secrets: inherit
