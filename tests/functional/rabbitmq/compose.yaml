services:
  app:
    image: ${DHI_DERIVED_IMAGE:?set DHI_DERIVED_IMAGE}
    build:
      context: .
      args:
        RUNTIME_IMAGE: ${DHI_IMAGE_UNDER_TEST:?set DHI_IMAGE_UNDER_TEST}
        DHI_SOURCE_IMAGE_ID: ${DHI_SOURCE_IMAGE_ID:?set DHI_SOURCE_IMAGE_ID}
    pull_policy: never
    platform: ${DHI_PLATFORM:?set DHI_PLATFORM}
    labels:
      io.pesla.dhi.functional.role: sut
      io.pesla.dhi.functional.identity-mode: derived-rootfs-prefix
    hostname: app
    read_only: true
    volumes:
      - data:/var/lib/rabbitmq
      - ./secrets/app-password.txt:/run/secrets/rabbitmq-app-password:ro
    tmpfs:
      - /run/rabbitmq:uid=10001,gid=0,mode=0770
      - /var/log/rabbitmq:uid=10001,gid=0,mode=0770
      - /tmp:uid=10001,gid=0,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  test:
    build:
      context: ../harness
      args:
        PYTHON_IMAGE: ${DHI_FIXTURE_PYTHON_IMAGE:?set DHI_FIXTURE_PYTHON_IMAGE}
    pull_policy: never
    entrypoint: [python, /harness/rabbitmq_verify.py]
    labels:
      io.pesla.dhi.functional.role: test
    depends_on: [app]
    read_only: true
    volumes:
      - ./verify.py:/harness/rabbitmq_verify.py:ro
      - ./secrets/app-password.txt:/run/secrets/rabbitmq-app-password:ro
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  data: {}

networks:
  default:
    internal: true
