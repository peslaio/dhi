name: Build Memcached image

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: memcached-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: memcached

  memcached:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: memcached
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,memcached
      runtime_closure: true
      runtime_closure_binaries: /usr/bin/memcached
      forbidden_packages: apt,libapt-pkg6.0,debian-archive-keyring,gpgv,bash,dash,dpkg
      allowed_packages: base-files,libc6,libevent-2.1-7,libsasl2-2,libssl3,memcached
      entrypoint: '["/usr/bin/memcached"]'
      cmd: '["-m","64","-p","11211","-l","0.0.0.0","-U","0"]'
      workdir: /data
      exposed_ports: "11211"
      runtime_user_name: memcached
      runtime_home: /data
      writable_paths: /data
      smoke_mode: running
      smoke_tcp_port: "11211"
      smoke_command: /usr/bin/memcached -h
      smoke_expected_output: memcached
      remove_shell: true
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, memcached]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: memcached
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs.memcached.result }}
