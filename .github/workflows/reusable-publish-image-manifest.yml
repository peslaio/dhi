name: Reusable OCI image manifest publish

on:
  workflow_call:
    inputs:
      image_name:
        description: OCI image name.
        required: true
        type: string
      image_version:
        description: Application version used in tags.
        required: true
        type: string
      debian_suite:
        description: Debian suite used in tags.
        required: false
        default: bookworm
        type: string
      debian_arches:
        description: Space-separated Debian architectures included in the manifest.
        required: false
        default: amd64 arm64
        type: string
      registry:
        description: OCI registry host.
        required: false
        default: ghcr.io
        type: string
      namespace:
        description: Registry namespace. Defaults to the repository owner when empty.
        required: false
        default: ""
        type: string
      sign:
        description: Sign the published manifest digest with cosign keyless signing.
        required: false
        default: true
        type: boolean
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
    outputs:
      digest:
        description: Published manifest digest.
        value: ${{ jobs.promote.outputs.digest }}

jobs:
  prepare-platform-matrix:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build native platform matrix
        id: matrix
        env:
          DEBIAN_ARCHES: ${{ inputs.debian_arches }}
        run: |
          set -euo pipefail
          matrix="$(python3 - <<'PY'
          import json
          import os

          arches = os.environ["DEBIAN_ARCHES"].split()
          if not arches or len(arches) != len(set(arches)):
              raise SystemExit("Debian architectures must be non-empty and unique")
          if any(arch not in {"amd64", "arm64"} for arch in arches):
              raise SystemExit("unsupported Debian architecture")
          print(json.dumps({"include": [
              {"debian_arch": arch, "platform": f"linux/{arch}"}
              for arch in arches
          ]}, separators=(",", ":")))
          PY
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish-candidate:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      primary_tag: ${{ steps.meta.outputs.primary_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare image metadata
        id: meta
        env:
          REGISTRY: ${{ inputs.registry }}
          NAMESPACE: ${{ inputs.namespace }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          DEBIAN_SUITE: ${{ inputs.debian_suite }}
        run: |
          set -euo pipefail
          namespace="${NAMESPACE:-$GITHUB_REPOSITORY_OWNER}"
          image_ref="${REGISTRY}/${namespace}/${IMAGE_NAME}"
          image_ref="$(printf '%s' "$image_ref" | tr '[:upper:]' '[:lower:]')"
          primary_tag="${image_ref}:${IMAGE_VERSION}-${DEBIAN_SUITE}"

          {
            echo "image_ref=$image_ref"
            echo "primary_tag=$primary_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Download immutable architecture digests
        env:
          # Upstream actions/download-artifact#484; keep other Node warnings visible.
          NODE_OPTIONS: --disable-warning=DEP0005
        uses: actions/download-artifact@v8
        with:
          pattern: image-release-digest--${{ inputs.image_name }}--${{ inputs.image_version }}--${{ inputs.debian_suite }}--*--attempt-${{ github.run_attempt }}
          path: artifacts/published
          merge-multiple: true

      - name: Verify immutable manifest sources
        id: sources
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          set -euo pipefail
          python3 tests/functional/releasectl.py manifest-sources \
            --records artifacts/published \
            --github-output "$GITHUB_OUTPUT" \
            --image-name "${{ inputs.image_name }}" \
            --image-version "${{ inputs.image_version }}" \
            --debian-suite "${{ inputs.debian_suite }}" \
            --debian-arches "${{ inputs.debian_arches }}" \
            --image-ref "$IMAGE_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Reject newer release inputs on main
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if ! printf '%s\n' "$main_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve the current main commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"; then
            echo "Refusing to publish commit $GITHUB_SHA because it is not an ancestor of current main $main_sha" >&2
            exit 1
          fi
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "Release commit is current on main"
          else
            changed_files="$RUNNER_TEMP/dhi-newer-main-paths.txt"
            git log --format= --name-only --no-renames "$GITHUB_SHA..$main_sha" \
              | sed '/^$/d' \
              | sort -u \
              > "$changed_files"
            python3 tests/functional/releasectl.py guard-current \
              --image-name "$IMAGE_NAME" \
              --changed-files "$changed_files"
          fi

      - name: Log in to registry
        id: manifest_candidate_registry_login
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.registry_username || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password || github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" \
            | python3 tests/functional/releasectl.py registry-login \
                --registry "$REGISTRY" \
                --username "$REGISTRY_USERNAME"

      - name: Publish run-scoped candidate manifest
        id: publish
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          DEBIAN_SUITE: ${{ inputs.debian_suite }}
          SOURCE_REFS: ${{ steps.sources.outputs.source_refs }}
        run: |
          set -euo pipefail
          refs=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            refs+=("$tag")
          done <<< "$SOURCE_REFS"

          candidate_tag="${IMAGE_REF}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE_VERSION}-${DEBIAN_SUITE}"
          python3 tests/functional/releasectl.py registry-command -- \
            docker buildx imagetools create --tag "$candidate_tag" "${refs[@]}"
          digest="$(python3 tests/functional/releasectl.py registry-digest \
            --reference "$candidate_tag")"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Failed to resolve candidate manifest digest for $candidate_tag" >&2
            exit 1
          fi
          {
            echo "candidate_tag=$candidate_tag"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "Published candidate $candidate_tag@$digest"

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign candidate manifest digest
        if: inputs.sign
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image_digest="$IMAGE_REF@$DIGEST"
          attempt=1
          max_attempts=5
          until cosign sign --yes "$image_digest"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Failed to sign $image_digest after $attempt attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Signing $image_digest failed on attempt $attempt. Retrying in ${delay}s..." >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Log out of registry
        if: ${{ always() && steps.manifest_candidate_registry_login.outcome == 'success' }}
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          docker logout "$REGISTRY"

  accept-candidate-index:
    needs: [prepare-platform-matrix, publish-candidate]
    permissions:
      actions: read
      contents: read
      packages: read
    runs-on: ${{ matrix.debian_arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs['prepare-platform-matrix'].outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download accepted native architecture digest
        env:
          # Upstream actions/download-artifact#484; keep other Node warnings visible.
          NODE_OPTIONS: --disable-warning=DEP0005
        uses: actions/download-artifact@v8
        with:
          name: image-release-digest--${{ inputs.image_name }}--${{ inputs.image_version }}--${{ inputs.debian_suite }}--${{ matrix.debian_arch }}--attempt-${{ github.run_attempt }}
          path: artifacts/accepted-member

      - name: Resolve accepted native architecture digest
        id: accepted-member
        env:
          IMAGE_REF: ${{ needs['publish-candidate'].outputs.image_ref }}
        run: |
          set -euo pipefail
          python3 tests/functional/releasectl.py manifest-sources \
            --records artifacts/accepted-member \
            --github-output "$GITHUB_OUTPUT" \
            --image-name "${{ inputs.image_name }}" \
            --image-version "${{ inputs.image_version }}" \
            --debian-suite "${{ inputs.debian_suite }}" \
            --debian-arches "${{ matrix.debian_arch }}" \
            --image-ref "$IMAGE_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Log in to registry for candidate pull
        id: index_acceptance_registry_login
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.registry_username || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password || github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" \
            | python3 tests/functional/releasectl.py registry-login \
                --registry "$REGISTRY" \
                --username "$REGISTRY_USERNAME"

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Verify candidate index signature
        if: inputs.sign
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/candidate-index-functional
          IMAGE_REF: ${{ needs['publish-candidate'].outputs.image_ref }}
          INDEX_DIGEST: ${{ needs['publish-candidate'].outputs.digest }}
        run: |
          set -euo pipefail
          identity_regex="$(python3 - <<'PY'
          import os
          import re

          repository = re.escape(os.environ["GITHUB_REPOSITORY"])
          print(rf"^https://github\.com/{repository}/\.github/workflows/[^@]+@refs/heads/main$")
          PY
          )"
          mkdir -p "$EVIDENCE_DIR"
          index_ref="$IMAGE_REF@$INDEX_DIGEST"
          attempt=1
          max_attempts=5
          until cosign verify \
              --certificate-identity-regexp "$identity_regex" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --output json \
              "$index_ref" > "$EVIDENCE_DIR/cosign-index.json"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Failed to verify $index_ref after $attempt attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Verification of $index_ref failed on attempt $attempt. Retrying in ${delay}s..." >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Pull candidate index and run selected platform natively
        env:
          DHI_FUNCTIONAL_ARTIFACT_DIR: ${{ runner.temp }}/candidate-index-functional
          DHI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-candidate-index-${{ matrix.debian_arch }}
          IMAGE_REF: ${{ needs['publish-candidate'].outputs.image_ref }}
          INDEX_DIGEST: ${{ needs['publish-candidate'].outputs.digest }}
          MEMBER_SOURCE_REFS: ${{ steps.accepted-member.outputs.source_refs }}
        run: |
          set -euo pipefail
          source_ref="${IMAGE_REF}@${INDEX_DIGEST}"
          member_ref="$(printf '%s\n' "$MEMBER_SOURCE_REFS" | sed '/^$/d')"
          if [ "$(printf '%s\n' "$member_ref" | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "Expected exactly one accepted architecture reference" >&2
            exit 1
          fi
          expected_member_digest="${member_ref##*@}"
          observed_index_digest="$(python3 tests/functional/releasectl.py registry-digest \
            --reference "$source_ref" \
            --expected-digest "$INDEX_DIGEST")"
          if [ "$observed_index_digest" != "$INDEX_DIGEST" ]; then
            echo "Candidate index resolved to $observed_index_digest instead of $INDEX_DIGEST" >&2
            exit 1
          fi
          mkdir -p "$DHI_FUNCTIONAL_ARTIFACT_DIR"
          python3 tests/functional/releasectl.py registry-command -- \
            docker buildx imagetools inspect "$source_ref" --raw \
            > "$DHI_FUNCTIONAL_ARTIFACT_DIR/index.json"
          python3 tests/functional/releasectl.py verify-index \
            --inspect "$DHI_FUNCTIONAL_ARTIFACT_DIR/index.json" \
            --platform "${{ matrix.platform }}" \
            --expected-digest "$expected_member_digest"
          python3 tests/functional/releasectl.py registry-command -- \
            docker pull --platform "${{ matrix.platform }}" "$source_ref"
          tests/functional/run.sh \
            "${{ inputs.image_name }}" \
            "$source_ref" \
            "${{ inputs.image_version }}" \
            "${{ matrix.platform }}"

      - name: Upload candidate index acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-release-index-acceptance--${{ inputs.image_name }}--${{ inputs.image_version }}--${{ inputs.debian_suite }}--${{ matrix.debian_arch }}--attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-index-functional
          if-no-files-found: error
          retention-days: 7

      - name: Log out of registry
        if: ${{ always() && steps.index_acceptance_registry_login.outcome == 'success' }}
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          docker logout "$REGISTRY"

  promote:
    needs: [publish-candidate, accept-candidate-index]
    permissions:
      actions: read
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.promote.outputs.digest }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download accepted architecture digests
        env:
          # Upstream actions/download-artifact#484; keep other Node warnings visible.
          NODE_OPTIONS: --disable-warning=DEP0005
        uses: actions/download-artifact@v8
        with:
          pattern: image-release-digest--${{ inputs.image_name }}--${{ inputs.image_version }}--${{ inputs.debian_suite }}--*--attempt-${{ github.run_attempt }}
          path: artifacts/accepted
          merge-multiple: true

      - name: Verify accepted architecture sources
        id: accepted-sources
        env:
          IMAGE_REF: ${{ needs['publish-candidate'].outputs.image_ref }}
        run: |
          set -euo pipefail
          python3 tests/functional/releasectl.py manifest-sources \
            --records artifacts/accepted \
            --github-output "$GITHUB_OUTPUT" \
            --image-name "${{ inputs.image_name }}" \
            --image-version "${{ inputs.image_version }}" \
            --debian-suite "${{ inputs.debian_suite }}" \
            --debian-arches "${{ inputs.debian_arches }}" \
            --image-ref "$IMAGE_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Reject newer release inputs on main
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if ! printf '%s\n' "$main_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve the current main commit" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            changed_files="$RUNNER_TEMP/dhi-newer-main-paths.txt"
            git log --format= --name-only --no-renames "$GITHUB_SHA..$main_sha" \
              | sed '/^$/d' | sort -u > "$changed_files"
            python3 tests/functional/releasectl.py guard-current \
              --image-name "$IMAGE_NAME" --changed-files "$changed_files"
          fi

      - name: Log in to registry
        id: promotion_registry_login
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.registry_username || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password || github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" \
            | python3 tests/functional/releasectl.py registry-login \
                --registry "$REGISTRY" \
                --username "$REGISTRY_USERNAME"

      - name: Promote accepted candidate index
        id: promote
        env:
          DEBIAN_ARCHES: ${{ inputs.debian_arches }}
          IMAGE_REF: ${{ needs['publish-candidate'].outputs.image_ref }}
          INDEX_DIGEST: ${{ needs['publish-candidate'].outputs.digest }}
          PRIMARY_TAG: ${{ needs['publish-candidate'].outputs.primary_tag }}
          SOURCE_REFS: ${{ steps.accepted-sources.outputs.source_refs }}
        run: |
          set -euo pipefail
          refs=()
          while IFS= read -r source_ref; do
            [ -n "$source_ref" ] || continue
            refs+=("$source_ref")
          done <<< "$SOURCE_REFS"
          read -r -a arches <<< "$DEBIAN_ARCHES"
          if [ "${#refs[@]}" -ne "${#arches[@]}" ]; then
            echo "Accepted architecture source count does not match the declared architecture count" >&2
            exit 1
          fi

          for index in "${!refs[@]}"; do
            source_ref="${refs[$index]}"
            expected_digest="${source_ref##*@}"
            architecture_tag="${IMAGE_REF}:${{ inputs.image_version }}-${{ inputs.debian_suite }}-${arches[$index]}"
            python3 tests/functional/releasectl.py registry-command -- \
              docker buildx imagetools create --prefer-index=false --tag "$architecture_tag" "$source_ref"
            observed_arch_digest="$(python3 tests/functional/releasectl.py registry-digest \
              --reference "$architecture_tag" \
              --expected-digest "$expected_digest")"
            if [ "$observed_arch_digest" != "$expected_digest" ]; then
              echo "$architecture_tag resolved to $observed_arch_digest instead of $expected_digest" >&2
              exit 1
            fi
            echo "Promoted $architecture_tag to $observed_arch_digest"
          done

          python3 tests/functional/releasectl.py registry-command -- \
            docker buildx imagetools create --tag "$PRIMARY_TAG" "$IMAGE_REF@$INDEX_DIGEST"
          observed_digest="$(python3 tests/functional/releasectl.py registry-digest \
            --reference "$PRIMARY_TAG" \
            --expected-digest "$INDEX_DIGEST")"
          if [ "$observed_digest" != "$INDEX_DIGEST" ]; then
            echo "Stable tag resolved to $observed_digest instead of $INDEX_DIGEST" >&2
            exit 1
          fi
          echo "digest=$observed_digest" >> "$GITHUB_OUTPUT"
          echo "Promoted $PRIMARY_TAG to $observed_digest"

      - name: Log out of registry
        if: ${{ always() && steps.promotion_registry_login.outcome == 'success' }}
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          docker logout "$REGISTRY"
