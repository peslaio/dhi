name: Build PHP-FPM image

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: php-fpm-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: php-fpm

  php-fpm:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: php-fpm
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,php8.2-fpm
      runtime_closure: true
      runtime_closure_binaries: |
        /usr/sbin/php-fpm8.2
        /usr/lib/php/*/*.so
      runtime_closure_paths: |
        /etc/php
        /etc/php-fpm
        /etc/ssl/certs
        /usr/lib/php
        /usr/share/php8.2-common
        /usr/share/php/8.2/fpm
        /usr/share/zoneinfo
      forbidden_packages: apt,libapt-pkg6.0,debian-archive-keyring,gpgv,bash,dash,dpkg
      allowed_packages: base-files,ca-certificates,libacl1,libapparmor1,libargon2-1,libbsd0,libc6,libcap2,libedit2,libffi8,libgcc-s1,libgcrypt20,libgpg-error0,libicu72,liblz4-1,liblzma5,libmd0,libpcre2-8-0,libsodium23,libssl3,libstdc++6,libsystemd0,libtinfo6,libxml2,libzstd1,php-common,php8.2-cli,php8.2-common,php8.2-fpm,php8.2-opcache,php8.2-readline,tzdata,zlib1g
      config_path: images/php-fpm/php-fpm.conf
      entrypoint: '["/usr/sbin/php-fpm8.2"]'
      cmd: '["-F","-O","-y","/etc/php-fpm/php-fpm.conf"]'
      workdir: /var/www/html
      exposed_ports: "9000"
      runtime_user_name: php
      runtime_home: /var/www/html
      writable_paths: /tmp /run/php-fpm /var/log/php8.2-fpm /var/www/html
      smoke_mode: running
      smoke_tcp_port: "9000"
      smoke_command: /usr/sbin/php-fpm8.2 -tt -y /etc/php-fpm/php-fpm.conf
      smoke_expected_output: "test is successful"
      remove_shell: true
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, php-fpm]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: php-fpm
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs['php-fpm'].result }}
