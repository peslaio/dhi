name: Build Apache image

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: apache-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: apache

  apache:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: apache
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,apache2
      runtime_closure: true
      runtime_closure_binaries: |
        /usr/sbin/apache2
        /usr/lib/apache2/modules/mod_authz_core.so
        /usr/lib/apache2/modules/mod_authz_host.so
        /usr/lib/apache2/modules/mod_dir.so
        /usr/lib/apache2/modules/mod_mime.so
        /usr/lib/apache2/modules/mod_mpm_prefork.so
      runtime_closure_paths: |
        /etc/apache
        /etc/apache2
        /etc/mime.types
        /etc/ssl/certs
        /usr/lib/*/ossl-modules
        /var/www/html
      forbidden_packages: apt,libapt-pkg6.0,debian-archive-keyring,gpgv,bash,dash,dpkg
      allowed_packages: apache2,apache2-bin,base-files,ca-certificates,libapr1,libaprutil1,libc6,libcrypt1,libexpat1,libpcre2-8-0,libssl3,libuuid1,media-types
      config_path: images/apache/apache.conf
      entrypoint: '["/usr/sbin/apache2"]'
      cmd: '["-DFOREGROUND","-f","/etc/apache/apache.conf"]'
      workdir: /var/www/html
      exposed_ports: "8080"
      writable_paths: /run/apache /var/log/apache2 /var/cache/apache2
      smoke_mode: running
      smoke_http_port: "8080"
      smoke_http_path: /
      smoke_command: /usr/sbin/apache2 -t -f /etc/apache/apache.conf
      smoke_expected_output: "Syntax OK"
      remove_shell: true
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, apache]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: apache
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs.apache.result }}
