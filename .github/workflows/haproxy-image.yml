name: Build HAProxy image

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: haproxy-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: haproxy

  haproxy:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: haproxy
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,haproxy
      runtime_closure: true
      runtime_closure_binaries: /usr/sbin/haproxy
      runtime_closure_paths: |
        /etc/haproxy
        /etc/ssl/certs
        /usr/lib/*/ossl-modules
      forbidden_packages: apt,libapt-pkg6.0,debian-archive-keyring,gpgv,bash,dash,dpkg
      allowed_packages: ca-certificates,haproxy,libc6,libcap2,libcrypt1,libgcc-s1,libgpg-error0,liblzma5,libssl3
      config_path: images/haproxy/haproxy.conf
      entrypoint: '["/usr/sbin/haproxy"]'
      cmd: '["-f","/etc/haproxy/haproxy.conf","-db"]'
      workdir: /var/lib/haproxy
      exposed_ports: "8080"
      runtime_user_name: haproxy
      runtime_home: /var/lib/haproxy
      writable_paths: /run/haproxy /var/lib/haproxy
      smoke_command: /usr/sbin/haproxy -c -f /etc/haproxy/haproxy.conf
      smoke_expected_output: "Configuration file is valid"
      smoke_mode: running
      smoke_http_port: "8080"
      smoke_http_path: /healthz
      smoke_http_expected_body: OK
      remove_shell: true
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, haproxy]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: haproxy
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs.haproxy.result }}
