global
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 2s

frontend http
    bind :8080
    default_backend app

backend app
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server backend-a backend-a:8080 check inter 200ms fall 2 rise 2
    server backend-b backend-b:8080 check inter 200ms fall 2 rise 2
