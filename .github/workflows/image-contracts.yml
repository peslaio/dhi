name: Image contracts

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Use all or one image family name.
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: image-contracts-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate contract metadata and Compose contracts
        run: ruby tests/functional/contractctl.rb validate

      - name: Verify pinned fixture index platforms
        if: ${{ github.event_name == 'schedule' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'all') }}
        run: python3 tests/functional/fixturectl.py validate --online

      - name: Check Ruby syntax
        run: ruby -c tests/functional/contractctl.rb

      - name: Check Bash syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find tests/functional -type f -name '*.sh' -print0)

      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/dhi-python-cache
        run: python3 -m compileall -q tests/functional

      - name: Run contract control-plane self-tests
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/dhi-python-cache
        run: python3 tests/functional/selftest.py

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

  plan:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select expected contract legs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" > artifacts/changed-files.txt
              ;;
            workflow_dispatch)
              if [ "$SCOPE" = all ]; then
                printf '%s\n' tests/functional/run.sh > artifacts/changed-files.txt
              else
                ruby tests/functional/contractctl.rb matrix --name "$SCOPE" --kind build >/dev/null
                printf 'images/%s/image.yaml\n' "$SCOPE" > artifacts/changed-files.txt
              fi
              ;;
            merge_group|schedule)
              printf '%s\n' tests/functional/run.sh > artifacts/changed-files.txt
              ;;
            *)
              echo "Unsupported image-contract event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          plan="$(ruby tests/functional/contractctl.rb plan --files artifacts/changed-files.txt)"
          printf '%s\n' "$plan" > artifacts/plan.json
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

  apache:
    needs: [preflight, plan]
    if: ${{ contains(fromJSON(needs.plan.outputs.plan).selectedFamilies, 'apache') }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/apache-image.yml
    with:
      orchestrated: true
      push: false

  caddy:
    needs: [preflight, plan]
