name: Build Redis image

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: redis-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: redis

  redis:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: redis
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,redis-server,redis-tools
      runtime_closure: true
      runtime_closure_binaries: /usr/bin/redis-server /usr/bin/redis-cli
      runtime_closure_paths: |
        /etc/redis
      forbidden_packages: apt,libapt-pkg6.0,debian-archive-keyring,gpgv,bash,dash,dpkg
      allowed_packages: base-files,libatomic1,libc6,libcap2,libgcc-s1,libgcrypt20,libgpg-error0,libjemalloc2,liblz4-1,liblzf1,liblzma5,libssl3,libstdc++6,libsystemd0,libzstd1,redis-server,redis-tools
      entrypoint: '["/usr/bin/redis-server"]'
      cmd: '["/etc/redis/redis.conf"]'
      workdir: /data
      exposed_ports: "6379"
      config_path: images/redis/redis.conf
      writable_paths: /data /run/redis /var/lib/redis
      smoke_mode: ${{ matrix.debian_arch == 'arm64' && 'oneshot' || 'running' }}
      smoke_tcp_port: "6379"
      smoke_command: ${{ matrix.debian_arch == 'arm64' && '--version' || '/usr/bin/redis-cli ping' }}
      smoke_expected_output: ${{ matrix.debian_arch == 'arm64' && 'Redis server' || 'PONG' }}
      remove_shell: true
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, redis]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: redis
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs.redis.result }}
