name: Build PostgreSQL image

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: postgresql-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: postgresql

  postgresql:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: postgresql
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,postgresql-15
      cmd: '["/usr/lib/postgresql/15/bin/postgres","--version"]'
      workdir: /var/lib/postgresql
      exposed_ports: "5432"
      runtime_user_name: postgres
      runtime_home: /var/lib/postgresql
      writable_paths: /var/lib/postgresql /run/postgresql /var/log/postgresql
      smoke_mode: oneshot
      smoke_command: /usr/lib/postgresql/15/bin/postgres --version
      smoke_expected_output: PostgreSQL
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, postgresql]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: postgresql
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs.postgresql.result }}
