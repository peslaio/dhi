services:
  app:
    image: ${DHI_IMAGE_UNDER_TEST:?set DHI_IMAGE_UNDER_TEST}
    pull_policy: never
    platform: ${DHI_PLATFORM:?set DHI_PLATFORM}
    labels:
      io.pesla.dhi.functional.role: sut
      io.pesla.dhi.functional.identity-mode: exact-container-image
    command: [/etc/redis/functional.conf]
    volumes:
      - ./redis.conf:/etc/redis/functional.conf:ro
      - data:/data
    read_only: true
    tmpfs:
      - /run/redis:uid=10001,gid=0,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  test:
    build:
      context: ../harness
      args:
        PYTHON_IMAGE: ${DHI_FIXTURE_PYTHON_IMAGE:?set DHI_FIXTURE_PYTHON_IMAGE}
    pull_policy: never
    labels:
      io.pesla.dhi.functional.role: test
    environment:
      DHI_LIFECYCLE_PHASE: initial
    command:
      - redis
      - --host
      - app
      - --username
      - functional
      - --password
      - dhi-functional-only-password
      - --concurrency
      - "32"
    depends_on: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  default:
    internal: true

volumes:
  data: {}
