      orchestrated: true
      push: false

  gate:
    name: Image contract gate
    needs:
      - preflight
      - plan
      - apache
      - caddy
      - dotnet_aspnet
      - dotnet_runtime
      - haproxy
      - java_jre
      - mariadb
      - memcached
      - mongodb
      - nginx
      - node
      - php_fpm
      - postgresql
      - python
      - rabbitmq
      - redis
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate selected and skipped caller results
        id: topology
        continue-on-error: true
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          ruby -rjson -e '
            plan = JSON.parse(ENV.fetch("PLAN_JSON"))
            needs = JSON.parse(ENV.fetch("NEEDS_JSON"))
            abort "preflight result is #{needs.dig("preflight", "result").inspect}" unless needs.dig("preflight", "result") == "success"
            abort "plan result is #{needs.dig("plan", "result").inspect}" unless needs.dig("plan", "result") == "success"
            family_jobs = {
              "apache" => "apache", "caddy" => "caddy",
              "dotnet-aspnet" => "dotnet_aspnet", "dotnet-runtime" => "dotnet_runtime",
              "haproxy" => "haproxy", "java-jre" => "java_jre", "mariadb" => "mariadb",
              "memcached" => "memcached", "mongodb" => "mongodb", "nginx" => "nginx",
              "node" => "node", "php-fpm" => "php_fpm", "postgresql" => "postgresql",
              "python" => "python", "rabbitmq" => "rabbitmq", "redis" => "redis"
            }
            selected = plan.fetch("selectedFamilies")
            unknown = selected - family_jobs.keys
            abort "plan selected unknown families: #{unknown.join(", ")}" unless unknown.empty?
            family_jobs.each do |family, job|
              expected = selected.include?(family) ? "success" : "skipped"
              actual = needs.dig(job, "result")
              abort "#{family} caller result is #{actual.inspect}; expected #{expected}" unless actual == expected
            end
          '

      - name: Prepare aggregate directories and plan
        if: ${{ always() }}
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/results
          printf '%s\n' "$PLAN_JSON" > artifacts/plan.json

      - name: Download selected result artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: image-contract-result--*
          path: artifacts/results

      - name: Aggregate selected contract results
        id: aggregate
        if: ${{ always() }}
        continue-on-error: true
        run: ruby tests/functional/contractctl.rb aggregate --results artifacts/results --plan artifacts/plan.json

      - name: Enforce stable image contract gate
        if: ${{ always() }}
        env:
          TOPOLOGY_OUTCOME: ${{ steps.topology.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          set -euo pipefail
          test "$TOPOLOGY_OUTCOME" = success
          test "$AGGREGATE_OUTCOME" = success
