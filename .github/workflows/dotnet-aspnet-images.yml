name: Build ASP.NET runtime images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reusable-build-debian-image.yml
      - .github/workflows/reusable-prepare-image-matrix.yml
      - .github/workflows/reusable-publish-image-manifest.yml
      - .github/workflows/dotnet-aspnet-images.yml
      - images/dotnet-aspnet/**
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      push:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      push:
        description: Push to the configured registry after build, smoke test, SBOM, and scan.
        required: false
        default: false
        type: boolean

concurrency:
  group: dotnet-aspnet-images-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: dotnet-aspnet

  dotnet-aspnet:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: dotnet-aspnet
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates
      post_packages: aspnetcore-runtime-${{ matrix.version }}
      extra_apt_key_urls: |
        https://packages.microsoft.com/keys/microsoft.asc
      extra_apt_sources: |
        deb [arch=amd64,arm64] https://packages.microsoft.com/debian/12/prod bookworm main
      cmd: '["/usr/bin/dotnet","--info"]'
      workdir: /app
      exposed_ports: "8080"
      environment: |
        DOTNET_RUNNING_IN_CONTAINER=true
        ASPNETCORE_HTTP_PORTS=8080
      runtime_user_name: dotnet
      runtime_home: /home/dotnet
      writable_paths: /app /home/dotnet
      smoke_mode: oneshot
      smoke_command: /usr/bin/dotnet --list-runtimes
      smoke_expected_output: "Microsoft.AspNetCore.App"
      push_primary_tag: false
      push: ${{ !inputs.orchestrated && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.push)) }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true
      sign: true
    secrets: inherit

  contract-aggregate:
    needs: [prepare, dotnet-aspnet]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: dotnet-aspnet
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs['dotnet-aspnet'].result }}

  dotnet-aspnet-manifest:
    needs: [prepare, contract-aggregate]
    if: ${{ !inputs.orchestrated && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.push)) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.manifest_matrix) }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-publish-image-manifest.yml
    with:
      image_name: dotnet-aspnet
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arches: ${{ matrix.debian_arches }}
      sign: true
    secrets: inherit
