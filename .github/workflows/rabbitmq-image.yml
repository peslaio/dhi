name: Build RabbitMQ image

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: rabbitmq-image-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: rabbitmq

  rabbitmq:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: rabbitmq
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates,rabbitmq-server
      cmd: '["/usr/lib/rabbitmq/bin/rabbitmq-server"]'
      workdir: /var/lib/rabbitmq
      exposed_ports: "5672"
      runtime_user_name: rabbitmq
      runtime_home: /var/lib/rabbitmq
      environment: |
        HOME=/var/lib/rabbitmq
        RABBITMQ_MNESIA_BASE=/var/lib/rabbitmq/mnesia
        RABBITMQ_LOGS=-
        RABBITMQ_SASL_LOGS=-
      writable_paths: /var/lib/rabbitmq /run/rabbitmq /var/log/rabbitmq
      runtime_remove_paths: /var/lib/rabbitmq/.erlang.cookie
      smoke_mode: running
      smoke_startup_timeout_seconds: "120"
      smoke_tcp_port: "5672"
      smoke_command: /usr/sbin/rabbitmq-diagnostics -q ping
      smoke_expected_output: Ping succeeded
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, rabbitmq]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: rabbitmq
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs.rabbitmq.result }}
