name: Build .NET runtime images

on:
  workflow_call:
    inputs:
      orchestrated:
        required: false
        default: false
        type: boolean
      export_image:
        required: false
        default: false
        type: boolean
concurrency:
  group: dotnet-runtime-images-${{ inputs.orchestrated && format('contracts-{0}', github.run_id) || format('publish-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prepare-image-matrix.yml
    with:
      image_name: dotnet-runtime

  dotnet-runtime:
    needs: prepare
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: ./.github/workflows/reusable-build-debian-image.yml
    with:
      image_name: dotnet-runtime
      image_version: ${{ matrix.version }}
      debian_suite: ${{ matrix.debian_suite }}
      debian_arch: ${{ matrix.debian_arch }}
      platform: ${{ matrix.platform }}
      packages: ca-certificates
      post_packages: dotnet-runtime-${{ matrix.version }}
      extra_apt_key_urls: |
        https://packages.microsoft.com/keys/microsoft.asc
      extra_apt_sources: |
        deb [arch=amd64,arm64] https://packages.microsoft.com/debian/12/prod bookworm main
      cmd: '["/usr/bin/dotnet","--info"]'
      workdir: /app
      environment: |
        DOTNET_RUNNING_IN_CONTAINER=true
      runtime_user_name: dotnet
      runtime_home: /home/dotnet
      writable_paths: /app /home/dotnet
      smoke_mode: oneshot
      smoke_command: /usr/bin/dotnet --list-runtimes
      smoke_expected_output: "Microsoft.NETCore.App"
      export_image: ${{ inputs.export_image }}
      generate_sbom: true
      scan: true
      fail_on_vulnerabilities: true

  contract-aggregate:
    needs: [prepare, dotnet-runtime]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-aggregate-image-contract.yml
    with:
      image_name: dotnet-runtime
      prepare_result: ${{ needs.prepare.result }}
      build_result: ${{ needs['dotnet-runtime'].result }}
